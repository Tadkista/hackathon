    <script>

      (function() {
        try {
          var r = document.documentElement;
          var t = localStorage.getItem('mojtorun-theme');
          var dark = t === 'dark' || ((t === null || t === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            r.classList.add('dark');
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#090d14');
          }
          var p = JSON.parse(localStorage.getItem('mojtorun-prefs') || '{}');
          if (p.hc) r.classList.add('hc');
          var F = { small: 0.9, normal: 1, large: 1.15, xlarge: 1.3 };
          var U = { compact: 0.9, normal: 1, large: 1.12 };
          r.style.setProperty('--font-scale', F[p.font] || 1);
          r.style.setProperty('--ui-scale', U[p.ui] || 1);
        } catch (e) {}
      })();
