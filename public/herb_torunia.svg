  <!-- Halo -->
  <circle cx="100" cy="58" r="20" fill="none" stroke="#FFD700" stroke-width="3"/>
  <!-- Keys -->
  <line x1="85" y1="115" x2="85" y2="155" stroke="#FFD700" stroke-width="4"/>
  <circle cx="85" cy="118" r="7" fill="none" stroke="#FFD700" stroke-width="3"/>
  <line x1="85" y1="135" x2="92" y2="135" stroke="#FFD700" stroke-width="3"/>
  <line x1="85" y1="145" x2="90" y2="145" stroke="#FFD700" stroke-width="3"/>
  <line x1="115" y1="115" x2="115" y2="155" stroke="#FFD700" stroke-width="4"/>
  <circle cx="115" cy="118" r="7" fill="none" stroke="#FFD700" stroke-width="3"/>
  <line x1="115" y1="135" x2="122" y2="135" stroke="#FFD700" stroke-width="3"/>
  <line x1="115" y1="145" x2="120" y2="145" stroke="#FFD700" stroke-width="3"/>
  <!-- Shield border -->
